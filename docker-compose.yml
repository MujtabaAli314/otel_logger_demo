version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: oteldemo-postgres
    environment:
      POSTGRES_USER: oteldemo
      POSTGRES_PASSWORD: oteldemo
      POSTGRES_DB: oteldemo
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oteldemo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
